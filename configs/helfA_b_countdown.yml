# Dataset
data_path: "data/countdown/train_hf"
eval_data_path: null
max_length: 72
max_input_length: 16
pad_token: eos

# Encoder
encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

# Model architecture
model: ELF-B  # ELF-B, ELF-M
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Decoder objective
decoder_prob: 0.2
decoder_noise_scale: 1.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG
label_drop_prob: 0.1
self_cond_prob: 0.5

# Training (optimizer + schedule)
epochs: 60
global_batch_size: 512
blr: 0.001   # absolute lr 2e-3 at batch 512 (trainer scales blr by batch/256); 0.002 diverged the CE head
weight_decay: 0.0
warmup_steps: 5000
optimizer: adamw

# EMA
ema_decay1: 0.999

# Sampling
sampling_configs_path: "hcfrl/elf/configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 1000

# Logging & Checkpointing
log_freq: 100
save_freq: 10
eval_freq: 100000

# Output
output_dir: "outputs/helfA_b-countdown"
hf_repo_id: null
resume: null
init_from: "embedded-language-flows/ELF-B-owt-torch"

# Wandb
use_wandb: false
wandb_project: elf
wandb_entity: null
wandb_run_name: helfA_b-countdown

# Misc
seed: 42

# H-ELF coarse stream
n_clusters: 16
cluster_map: "data/clusters_task_arith_n16.pt"
cluster_scale: 2.0
lambda2: 1.0
lambda2_ce: 0.0
